name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # e.g. v1.0.0
      - "v[0-9]+.[0-9]+.[0-9]+.post*"  # e.g. v1.0.0.post1

# Only one publish job runs at a time
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # ── Validate tag matches package version ─────────────────────────────────────
  validate:
    name: Validate version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag == package version
        run: |
          # The version is dynamic (pyproject `dynamic = ["version"]`), sourced
          # from tokenforge/__init__.py __version__ — read it from there, not from
          # a non-existent [project].version key.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import re,pathlib; print(re.search(r'''__version__\s*=\s*['\"]([^'\"]+)['\"]''', pathlib.Path('tokenforge/__init__.py').read_text()).group(1))")
          echo "Tag version:        $TAG_VERSION"
          echo "tokenforge version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match tokenforge.__version__ ($PKG_VERSION)"
            exit 1
          fi

  # ── Run full CI on the release tag ──────────────────────────────────────────
  test:
    name: Test before publish
    needs: validate
    uses: ./.github/workflows/ci.yml

  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ── Publish to TestPyPI ──────────────────────────────────────────────────────
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/django-tokenforge
    permissions:
      id-token: write  # Required for OIDC trusted publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # ── Publish to PyPI ──────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-tokenforge
    permissions:
      id-token: write  # Required for OIDC trusted publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── Create GitHub Release ────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version from CHANGELOG.md
          python - <<'EOF'
          import re, os, sys
          version = os.environ.get("VERSION", "")
          with open("CHANGELOG.md") as f:
              content = f.read()
          pattern = rf"## \[{re.escape(version)}\].*?(?=\n## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          notes = match.group(0).strip() if match else f"Release {version}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              # Use heredoc delimiter to handle multiline output
              delimiter = "EOF_NOTES"
              out.write(f"notes<<{delimiter}\n{notes}\n{delimiter}\n")
          EOF
        env:
          VERSION: ${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: django-tokenforge ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
          files: dist/*
